# Installs dependencies, lints and runs the test suite across supported Node versions.
# For more information see: https://docs.github.com/actions/guides/building-and-testing-nodejs

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7
      # Must run before setup-node so that `cache: pnpm` can resolve the store path.
      # The pnpm version is read from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm test
